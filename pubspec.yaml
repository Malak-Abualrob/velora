name: velora
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  shared_preferences: ^2.2.2
  flutter_native_splash: ^2.4.6
  image_picker: ^1.2.3
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#F8F3F5"
  image: assets/images/logo.jpg

  android_12:
    color: "#F8F3F5"
    image: assets/images/logo.jpg

  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/